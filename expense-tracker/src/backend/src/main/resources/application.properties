spring.application.name=expense-tracker-api
server.port=8080

# Path to the JSON file used as the persistence store.
# Relative paths are resolved against the directory the JVM is started from.
app.data-file=expenses-data.json

# Swagger / OpenAPI UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Nicer JSON error bodies
server.error.include-message=always
